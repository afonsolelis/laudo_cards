<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Laudo — Laudo Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/styles.css?v=9" rel="stylesheet">
</head>

<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="./"><img src="favicon.svg" alt="" width="28" height="28"> Laudo Cards</a>
      <nav class="main-nav" aria-label="Principal">
        <a href="./">Início</a>
        <a href="./#graduadoras">Graduadoras</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <p class="state">Carregando…</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span><strong>Laudo Cards</strong> · Coleção pessoal de cartas graduadas</span>
      <span>Pokémon e seus nomes são marcas de seus respectivos donos.</span>
    </div>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="Foto ampliada">
    <button type="button" aria-label="Fechar">&times;</button>
    <img alt="">
  </dialog>

  <script type="module">
    import {
      loadCards, graderSlug, escapeHtml as e, safeUrl, gradeLabel, formatDateBR, formatBRL, PLACEHOLDER_IMG,
    } from './js/common.js';

    const root = document.getElementById('main');

    const LINKS = [
      ['tcg_player', 'TCGPlayer'],
      ['price_charting', 'PriceCharting'],
      ['liga_pokemon', 'Liga Pokémon'],
      ['myp_cards', 'MYP Cards'],
      ['ebay', 'eBay'],
    ];

    const COMPONENTS = [
      ['centering', 'Centralização'],
      ['corners', 'Cantos'],
      ['edges', 'Bordas'],
      ['surface', 'Superfície'],
    ];

    function message(text) {
      root.innerHTML = `<p class="state">${e(text)} · <a href="./">Voltar à coleção</a></p>`;
    }

    function render(card) {
      const grade = card.grade || {};
      const company = e(card.grading_company);
      const photos = [
        ['Frente', safeUrl(card.image_front_url, PLACEHOLDER_IMG)],
        ['Verso', safeUrl(card.image_back_url, PLACEHOLDER_IMG)],
      ];
      const certLink = safeUrl(card.cert_link);
      const links = card.links || {};

      document.title = `${card.name} (${card.number}) — Laudo Cards`;

      const meta = [
        ['Número', `<span class="mono">${e(card.number)}</span>`],
        ['Coleção', e(card.set_name)],
        ['Ano', e(card.year)],
        ['Raridade', e(card.rarity)],
        ['Tipo', e(card.pokemon_type)],
        ['Idioma', e(card.language)],
        ['Ilustrador', e(card.illustrator_name)],
        ['Certificado', `<span class="mono">${e(card.certificate_number)}</span>`],
        ['Ano da graduação', e(card.grading_year)],
        ['Na coleção desde', card.added_date ? e(formatDateBR(card.added_date)) : ''],
        ['Preço de aquisição', card.acquisition_price != null ? `R$ ${formatBRL(card.acquisition_price)}` : ''],
      ].filter(([, value]) => value !== '');

      const linkItems = LINKS.filter(([key]) => safeUrl(links[key])).map(([key, label]) => `
        <li><a href="${e(safeUrl(links[key]))}" target="_blank" rel="noopener noreferrer">${label} <span aria-hidden="true">↗</span></a></li>`).join('');

      const bars = COMPONENTS.filter(([key]) => grade[key] != null).map(([key, label]) => `
        <div class="bar-row">
          <div class="bar-label"><span>${label}</span><strong>${e(grade[key])}</strong></div>
          <div class="bar" role="img" aria-label="${label}: ${e(grade[key])} de 10"><span style="width:${Math.min(100, Number(grade[key]) * 10)}%"></span></div>
        </div>`).join('');

      const notes = card.grader_notes_markdown;
      const history = card.card_history || card.history_markdown;

      root.innerHTML = `
        <nav class="breadcrumb" aria-label="Trilha">
          <a href="./">Início</a><span aria-hidden="true">/</span>
          <a href="./#${e(graderSlug(card.grading_company))}">${company}</a><span aria-hidden="true">/</span>
          <span>${e(card.name)}</span>
        </nav>

        <div class="single">
          <div class="gallery">
            <button type="button" class="gallery-main" id="galleryMain" aria-label="Ampliar foto">
              <img src="${e(photos[0][1])}" alt="${e(card.name)} — ${photos[0][0]}">
            </button>
            <div class="gallery-thumbs">
              ${photos.map(([label, src], i) => `
                <button type="button" data-src="${e(src)}" data-label="${label}" aria-pressed="${i === 0}" aria-label="Mostrar ${label.toLowerCase()}">
                  <img src="${e(src)}" alt="">
                </button>`).join('')}
            </div>
          </div>

          <div class="summary">
            <span class="product-cat">${company} · Graduada</span>
            <h1>${e(card.name)}</h1>
            <p class="subtitle">${e(card.full_name || card.set_name)}</p>

            <div class="summary-grade">
              <strong>${e(gradeLabel(grade))}</strong>
              <span>${e(grade.description)}</span>
            </div>

            <dl class="meta">${meta.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>

            <div class="actions">
              ${certLink
                ? `<a class="btn btn-outline btn-block" href="${e(certLink)}" target="_blank" rel="noopener noreferrer">Ver laudo oficial ${company}</a>`
                : `<p class="notice">Consulta pública do certificado indisponível. Os dados foram conferidos no rótulo físico da graduadora.</p>`}
            </div>

            ${linkItems ? `<ul class="link-list" aria-label="Referências de preço">${linkItems}</ul>` : ''}
          </div>
        </div>

        ${bars || notes || history ? `
        <section class="details">
          <div class="details-grid">
            <div>
              <h2>Análise da graduação</h2>
              ${bars || '<p class="prose">Esta graduadora não informou notas por componente.</p>'}
            </div>
            <div>
              ${notes ? `<h2>Observações</h2><p class="prose">${e(notes)}</p>` : ''}
              ${history ? `<h2>Histórico da carta</h2><p class="prose">${e(history)}</p>` : ''}
            </div>
          </div>
        </section>` : ''}`;

      const main = document.getElementById('galleryMain');
      const mainImg = main.querySelector('img');
      root.querySelectorAll('.gallery-thumbs button').forEach((btn) => {
        btn.addEventListener('click', () => {
          mainImg.src = btn.dataset.src;
          mainImg.alt = `${card.name} — ${btn.dataset.label}`;
          root.querySelectorAll('.gallery-thumbs button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
        });
      });

      const box = document.getElementById('lightbox');
      const boxImg = box.querySelector('img');
      main.addEventListener('click', () => {
        boxImg.src = mainImg.src;
        boxImg.alt = mainImg.alt;
        box.showModal();
      });
      box.querySelector('button').addEventListener('click', () => box.close());
      box.addEventListener('click', (event) => { if (event.target === box) box.close(); });
    }

    const id = new URLSearchParams(location.search).get('id');
    if (!id) {
      message('Carta não informada');
    } else {
      try {
        const card = (await loadCards()).find((c) => c.id === id);
        card ? render(card) : message('Carta não encontrada');
      } catch (err) {
        console.error(err);
        message('Não foi possível carregar a carta');
      }
    }
  </script>
</body>

</html>
