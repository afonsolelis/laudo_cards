<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Laudo Cards</title>
  <script>
    // Mantém funcionando os links antigos: /laudo/<id> → laudo.html?id=<id>
    (function () {
      var match = location.pathname.match(/^(.*?)\/laudo\/([^/]+)\/?$/);
      if (match) location.replace(match[1] + '/laudo.html?id=' + encodeURIComponent(match[2]));
    })();
  </script>
  <style>body { background: #fff; color: #212121; font-family: system-ui, sans-serif; text-align: center; padding: 6rem 1rem; } a { color: #212121; }</style>
</head>
<body>
  <h1>Página não encontrada</h1>
  <p><a href="/laudo_cards/">Voltar à coleção</a></p>
</body>
</html>
