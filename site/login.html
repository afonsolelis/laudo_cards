<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Laudo Cards</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/styles.css?v=4" rel="stylesheet">
    <style>
        .login-container {
            max-width: 420px;
            margin: 6rem auto;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg site-nav sticky-top">
        <div class="container">
            <a class="navbar-brand site-brand" href="./">Cartas Graduadas</a>
        </div>
    </nav>

    <!-- Main login card -->
    <div class="container">
        <div class="login-container">
            <div class="panel">
                <div class="panel-head">
                    <h2 class="panel-title">Área Restrita</h2>
                </div>
                <div class="panel-body">
                    <p class="text-muted small mb-4">Autentique-se para gerenciar a coleção de cartas graduadas.</p>

                    <div id="loginError" class="alert alert-danger d-flex align-items-center gap-2 d-none" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <div id="loginErrorText"></div>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label font-semibold">E-mail</label>
                            <input type="email" class="form-control" id="email" placeholder="Seu e-mail" required autocomplete="username">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label font-semibold">Senha</label>
                            <input type="password" class="form-control" id="password" placeholder="Sua senha" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn btn-ink w-100 btn-lg py-2" id="btnLogin">
                            Acessar Painel
                        </button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-4">
                <a href="./" class="text-muted small"><i class="bi bi-arrow-left"></i> Voltar ao Portfólio</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { supabase, getSession } from './js/supabase.js';

        if (await getSession()) window.location.replace('admin.html');

        const form = document.getElementById('loginForm');
        const btn = document.getElementById('btnLogin');
        const errorBox = document.getElementById('loginError');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            errorBox.classList.add('d-none');
            const { error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
            });
            if (error) {
                document.getElementById('loginErrorText').textContent = 'Usuário ou senha incorretos';
                errorBox.classList.remove('d-none');
                btn.disabled = false;
                return;
            }
            window.location.replace('admin.html');
        });
    </script>
</body>
</html>
