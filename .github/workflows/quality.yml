name: Quality Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        # Versoes fixas: sem pin, um release novo do black reformata o codigo
        # e quebra `black --check` sem ninguem ter mexido em nada.
        pip install black==26.5.1 isort==8.0.1 flake8==7.3.0 bandit==1.9.4 pytest==9.1.1
        
    - name: Check code formatting with Black
      run: |
        black --check backend/
        
    - name: Check import sorting with isort
      run: |
        isort --check-only backend/
        
    - name: Lint with Flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Security scan with Bandit
      run: |
        bandit -r backend/ -c pyproject.toml || bandit -r backend/
        
    - name: Run Tests with Pytest
      run: |
        pytest backend/tests/
