<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Laudo Cards</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/styles.css?v=3" rel="stylesheet">
    <style>
        .login-container {
            max-width: 420px;
            margin: 6rem auto;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg site-nav sticky-top">
        <div class="container">
            <a class="navbar-brand site-brand" href="/">Cartas Graduadas</a>
        </div>
    </nav>

    <!-- Main login card -->
    <div class="container">
        <div class="login-container">
            <div class="panel">
                <div class="panel-head">
                    <h2 class="panel-title">Área Restrita</h2>
                </div>
                <div class="panel-body">
                    <p class="text-muted small mb-4">Autentique-se para gerenciar a coleção de cartas graduadas.</p>

                    {% if error %}
                    <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <div>{{ error }}</div>
                    </div>
                    {% endif %}

                    <form action="/login" method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label font-semibold">Usuário</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Seu usuário" required autocomplete="username">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label font-semibold">Senha</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Sua senha" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn btn-ink w-100 btn-lg py-2">
                            Acessar Painel
                        </button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-4">
                <a href="/" class="text-muted small"><i class="bi bi-arrow-left"></i> Voltar ao Portfólio</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
